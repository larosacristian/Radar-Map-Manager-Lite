# Radar Map Manager Lite - two HLK-LD6004 on one ESP32-C3.
# Requires ESPHome 2026.11 beta (or newer).
# PUBLIC TEMPLATE: Wi-Fi and API credentials are local !secret values.
# IMPORTANT: verify that GPIO4/5/6/7 are exposed and free on your exact board.
# DO NOT power the two radars from a weak on-board 3V3 regulator.

esphome:
  name: room-radar-dual
  friendly_name: Room
  comment: "Two LD6004 UART radars; no UDP, cloud or external component"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Disable UART logging: each LD6004 needs a dedicated hardware UART.
logger:
  level: INFO
  baud_rate: 0

api:
  encryption:
    key: !secret radar_api_key

ota:
  - platform: esphome
    encryption:  # Uses the native API key; firmware uploads are confidential.

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

# ESP TX -> radar RX0; ESP RX <- radar TX0. Common GND is mandatory.
uart:
  - id: uart_left
    tx_pin: GPIO4
    rx_pin: GPIO5
    baud_rate: 115200
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 1024
  - id: uart_right
    tx_pin: GPIO6
    rx_pin: GPIO7
    baud_rate: 115200
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 1024

ld6004:
  - id: left_radar
    uart_id: uart_left
  - id: right_radar
    uart_id: uart_right

binary_sensor:
  - platform: status
    name: "ESP Connected"
    entity_category: diagnostic
  - platform: ld6004
    ld6004_id: left_radar
    target:
      name: "Radar Left Presence"
      device_class: occupancy
      filters:
        - delayed_off: 10s
    target_1:
      name: "Radar Left Target 1 Present"
    target_2:
      name: "Radar Left Target 2 Present"
    target_3:
      name: "Radar Left Target 3 Present"
    detection_area_0:
      name: "Radar Left Hardware Area 0 Presence"
    detection_area_1:
      name: "Radar Left Hardware Area 1 Presence"
  - platform: ld6004
    ld6004_id: right_radar
    target:
      name: "Radar Right Presence"
      device_class: occupancy
      filters:
        - delayed_off: 10s
    target_1:
      name: "Radar Right Target 1 Present"
    target_2:
      name: "Radar Right Target 2 Present"
    target_3:
      name: "Radar Right Target 3 Present"
    detection_area_0:
      name: "Radar Right Hardware Area 0 Presence"
    detection_area_1:
      name: "Radar Right Hardware Area 1 Presence"

sensor:
  - platform: wifi_signal
    name: "ESP WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "ESP Uptime"
    update_interval: 60s
    entity_category: diagnostic
  - platform: ld6004
    ld6004_id: left_radar
    target_count:
      name: "Radar Left Target Count"
    target_1:
      x:
        name: "Radar Left Target 1 X"
      y:
        name: "Radar Left Target 1 Y"
      z:
        name: "Radar Left Target 1 Z"
      doppler_index:
        name: "Radar Left Target 1 Doppler"
      cluster_id:
        name: "Radar Left Target 1 Cluster"
    target_2:
      x:
        name: "Radar Left Target 2 X"
      y:
        name: "Radar Left Target 2 Y"
      z:
        name: "Radar Left Target 2 Z"
    target_3:
      x:
        name: "Radar Left Target 3 X"
      y:
        name: "Radar Left Target 3 Y"
      z:
        name: "Radar Left Target 3 Z"
  - platform: ld6004
    ld6004_id: right_radar
    target_count:
      name: "Radar Right Target Count"
    target_1:
      x:
        name: "Radar Right Target 1 X"
      y:
        name: "Radar Right Target 1 Y"
      z:
        name: "Radar Right Target 1 Z"
      doppler_index:
        name: "Radar Right Target 1 Doppler"
      cluster_id:
        name: "Radar Right Target 1 Cluster"
    target_2:
      x:
        name: "Radar Right Target 2 X"
      y:
        name: "Radar Right Target 2 Y"
      z:
        name: "Radar Right Target 2 Z"
    target_3:
      x:
        name: "Radar Right Target 3 X"
      y:
        name: "Radar Right Target 3 Y"
      z:
        name: "Radar Right Target 3 Z"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "ESP IP"
      entity_category: diagnostic
  - platform: ld6004
    ld6004_id: left_radar
    work_mode:
      name: "Radar Left Active Mode"
    ota_version:
      name: "Radar Left Firmware Version"
  - platform: ld6004
    ld6004_id: right_radar
    work_mode:
      name: "Radar Right Active Mode"
    ota_version:
      name: "Radar Right Firmware Version"

select:
  - platform: ld6004
    ld6004_id: left_radar
    installation_mode:
      name: "Radar Left Installation Mode"
    sensitivity:
      name: "Radar Left Sensitivity"
    trigger_speed:
      name: "Radar Left Trigger Speed"
    work_mode:
      name: "Radar Left Work Mode"
    area_id:
      name: "Radar Left Area To Edit"
  - platform: ld6004
    ld6004_id: right_radar
    installation_mode:
      name: "Radar Right Installation Mode"
    sensitivity:
      name: "Radar Right Sensitivity"
    trigger_speed:
      name: "Radar Right Trigger Speed"
    work_mode:
      name: "Radar Right Work Mode"
    area_id:
      name: "Radar Right Area To Edit"

# Hardware detection areas are optional; virtual room zones belong to RMM Lite.
# Do not apply these bounds until you have verified radar orientation and XYZ.
number:
  - platform: ld6004
    ld6004_id: left_radar
    hold_delay:
      name: "Radar Left Hold Delay"
    area_config:
      x_min: {name: "Radar Left Area X Min"}
      x_max: {name: "Radar Left Area X Max"}
      y_min: {name: "Radar Left Area Y Min"}
      y_max: {name: "Radar Left Area Y Max"}
      z_min: {name: "Radar Left Area Z Min"}
      z_max: {name: "Radar Left Area Z Max"}
  - platform: ld6004
    ld6004_id: right_radar
    hold_delay:
      name: "Radar Right Hold Delay"
    area_config:
      x_min: {name: "Radar Right Area X Min"}
      x_max: {name: "Radar Right Area X Max"}
      y_min: {name: "Radar Right Area Y Min"}
      y_max: {name: "Radar Right Area Y Max"}
      z_min: {name: "Radar Right Area Z Min"}
      z_max: {name: "Radar Right Area Z Max"}

switch:
  - platform: ld6004
    ld6004_id: left_radar
    target_display:
      name: "Radar Left Coordinate Reporting"
      restore_mode: RESTORE_DEFAULT_ON
  - platform: ld6004
    ld6004_id: right_radar
    target_display:
      name: "Radar Right Coordinate Reporting"
      restore_mode: RESTORE_DEFAULT_ON
# Deliberately no point_count or point_cloud: they activate a high-volume
# UART stream and reserve a larger buffer for EACH radar.

button:
  - platform: restart
    name: "ESP Restart"
    entity_category: diagnostic
  - platform: ld6004
    ld6004_id: left_radar
    get_areas: {name: "Radar Left Read Areas"}
    apply_area: {name: "Radar Left Apply Area"}
    auto_interference: {name: "Radar Left Auto Interference"}
    clear_interference: {name: "Radar Left Clear Interference"}
  - platform: ld6004
    ld6004_id: right_radar
    get_areas: {name: "Radar Right Read Areas"}
    apply_area: {name: "Radar Right Apply Area"}
    auto_interference: {name: "Radar Right Auto Interference"}
    clear_interference: {name: "Radar Right Clear Interference"}
